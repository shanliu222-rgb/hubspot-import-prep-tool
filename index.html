<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HubSpot Offline Event Leads Import Tool</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{
      --bg:#f6f8fb; --card:#fff; --text:#1f2937; --muted:#6b7280;
      --primary:#2563eb; --ok:#15803d; --warn:#b45309; --danger:#b91c1c; --border:#e5e7eb;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{max-width:980px;margin:24px auto;padding:0 14px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    h1{margin:0 0 8px;font-size:26px}
    h2{margin:0 0 10px;font-size:18px}
    .muted{color:var(--muted);font-size:13px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .col{flex:1;min-width:240px}
    label{display:block;font-weight:600;margin:8px 0 6px}
    input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;background:#fff}
    button{border:0;background:var(--primary);color:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px}
    .ok{background:#dcfce7;color:#166534}
    .warn{background:#fef3c7;color:#92400e}
    .danger{background:#fee2e2;color:#991b1b}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border:1px solid var(--border);padding:6px;text-align:left}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .lang button{width:auto;padding:8px 12px;background:#111827}
    .date-row{display:flex;gap:8px}
  </style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="topbar">
      <div>
        <h1 id="title"></h1>
        <div class="muted" id="notice"></div>
      </div>
      <div class="lang">
        <button id="btnZh" type="button">中文</button>
        <button id="btnEn" type="button">EN</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 id="guideTitle"></h2>
    <ul id="guideList"></ul>
  </div>

  <div class="card">
    <h2 id="uploadTitle"></h2>
    <label id="uploadLabel" for="fileInput"></label>
    <input id="fileInput" type="file" accept=".csv,.xlsx,.xls,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" />
    <div class="muted" id="uploadHint"></div>
  </div>

  <div class="card">
    <h2 id="requiredTitle"></h2>
    <div class="row">
      <div class="col">
        <label id="countryLabel"></label>
        <select id="countrySelect"><option value="">--</option></select>
        <div class="muted" id="countryHint"></div>
      </div>

      <div class="col">
        <label id="customerTypeLabel"></label>
        <select id="customerType">
          <option value="">--</option>
          <option value="Hytera Existing Customer">Hytera Existing Customer</option>
          <option value="Potential Contact">Potential Contact</option>
        </select>
        <div class="muted" id="customerTypeHint"></div>
      </div>

      <div class="col">
        <label id="attendAtLabel"></label>
        <div class="date-row">
          <select id="attendYear"></select>
          <select id="attendMonth"></select>
          <select id="attendDay"></select>
        </div>
        <div class="muted" id="attendHint"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 id="eventInfoTitle"></h2>
    <div class="row">
      <div class="col">
        <label id="eventCategoryLabel"></label>
        <select id="eventCategory">
          <option value="">--</option>
          <option>Exhibition</option>
          <option>Offline Activity</option>
          <option>Sales Contact</option>
          <option>Dealer Distributor</option>
          <option>Promotion</option>
          <option>Third Party Database</option>
          <option>Staff</option>
          <option>Online Webinar</option>
        </select>
      </div>
      <div class="col">
        <label id="eventNameLabel"></label>
        <input id="eventName" type="text" placeholder="e.g. AI Security Roadshow Dubai" />
      </div>
    </div>
  </div>

  <div class="card">
    <h2 id="actionTitle"></h2>
    <button id="btnValidate" type="button"></button>
    <p style="margin-top:10px;"><span id="statusBadge" class="badge warn"></span></p>
    <div id="statusMsg" class="muted"></div>
    <p id="fileNamePreview" class="muted" style="margin-top:8px;"></p>
    <p id="stats" class="muted"></p>
    <button id="btnExport" type="button" disabled></button>
    <div style="margin-top:12px;max-height:260px;overflow:auto">
      <table id="previewTable"></table>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
(() => {
  const i18n = {
    zh: {
      title: "HubSpot 线下活动线索导入工具",
      notice: "内部使用声明 / Internal Use Notice：仅用于市场部HubSpot导入前整理；文件仅在浏览器本地处理，不上传、不保存。",
      guideTitle: "使用指导（仅线下活动）",
      guideList: [
        "必须信息：Country、customer_type、Attend at。",
        "导出列顺序：原上传字段 + 新增必要字段（紧跟在后面）。",
        "Attend at 使用下拉选择，避免手填错误。"
      ],
      uploadTitle: "1) 上传数据文件",
      uploadLabel: "上传文件（CSV / XLSX / XLS）",
      uploadHint: "系统读取第一个工作表（Excel）。",
      requiredTitle: "2) 补充必填信息",
      countryLabel: "国家（单一国家可统一补齐）",
      countryHint: "若数据多国家且存在缺失，将阻断导出。",
      customerTypeLabel: "客户类型（必选）",
      customerTypeHint1: "提示：Dealer or Distributor or Partner（仅提示）",
      customerTypeHint2: "提示：not Dealer or Distributor or Partner（仅提示）",
      attendAtLabel: "Attend at（下拉选择）",
      attendHint: "格式自动生成：YYYY/MM/DD",
      eventInfoTitle: "3) 活动信息（用于文件命名）",
      eventCategoryLabel: "活动类型（必选）",
      eventNameLabel: "活动名称（必填）",
      actionTitle: "4) 校验并导出",
      validateBtn: "开始校验",
      exportBtn: "导出 CSV",
      blocked: "未通过",
      ready: "可导出",
      errFile: "请先上传文件。",
      errFormat: "仅支持 CSV / XLSX / XLS。",
      errCustomerType: "请选择客户类型。",
      errDate: "请完整选择 Attend at 年/月/日。",
      errCategory: "请选择活动类型。",
      errEventName: "请填写活动名称。",
      errCountryNeedSelect: "存在国家缺失，请先选择一个国家后再校验。",
      errCountryMulti: "检测到多国家且有缺失，请线下逐条补齐国家后重传。",
      errRequiredStillMissing: "仍有必填项缺失，无法导出。",
      okPass: "校验通过，可导出。",
      stats: (t,v,e) => `总行数: ${t} ｜ 可上传: ${v} ｜ 错误: ${e}`,
      filePreview: "导出文件名预览："
    },
    en: {
      title: "HubSpot Offline Event Leads Import Tool",
      notice: "Internal Use Notice: local processing only, no upload/storage.",
      guideTitle: "Guide",
      guideList: [
        "Required fields: Country, customer_type, Attend at.",
        "Export order: original uploaded columns + required fields appended at the end.",
        "Attend at uses dropdowns to avoid manual format errors."
      ],
      uploadTitle: "1) Upload file",
      uploadLabel: "Upload (CSV / XLSX / XLS)",
      uploadHint: "For Excel, first sheet only.",
      requiredTitle: "2) Required info",
      countryLabel: "Country (single-country global fill)",
      countryHint: "If multi-country + missing country, export is blocked.",
      customerTypeLabel: "Customer Type (required)",
      customerTypeHint1: "Hint: Dealer or Distributor or Partner",
      customerTypeHint2: "Hint: not Dealer or Distributor or Partner",
      attendAtLabel: "Attend at (dropdown)",
      attendHint: "Auto format: YYYY/MM/DD",
      eventInfoTitle: "3) Event info (file naming)",
      eventCategoryLabel: "Event Type (required)",
      eventNameLabel: "Event Name (required)",
      actionTitle: "4) Validate & Export",
      validateBtn: "Validate",
      exportBtn: "Export CSV",
      blocked: "Blocked",
      ready: "Ready",
      errFile: "Please upload a file first.",
      errFormat: "Only CSV / XLSX / XLS are supported.",
      errCustomerType: "Please select Customer Type.",
      errDate: "Please select complete Attend at year/month/day.",
      errCategory: "Please select Event Type.",
      errEventName: "Please input Event Name.",
      errCountryNeedSelect: "Country missing. Please select one country and validate again.",
      errCountryMulti: "Multi-country + missing country detected. Please fill country row-by-row offline and re-upload.",
      errRequiredStillMissing: "Required fields still missing. Export blocked.",
      okPass: "Validation passed. Ready to export.",
      stats: (t,v,e) => `Total: ${t} | Valid: ${v} | Error: ${e}`,
      filePreview: "Filename preview: "
    }
  };

  const countries = ["Uzbekistan","Ukraine","Tajikistan","Mongolia","Kyrgyzstan","Kazakhstan","Afghanistan","Georgia","Yemen","United Arab Emirates","Sierra Leone","Saudi Arabia","Qatar","Oman","Liberia","Kuwait","Iraq","Eritrea","Bahrain","Tanzania","Lebanon","Jordan","Vietnam","Singapore","Myanmar","New Zealand","India","Australia","Papua New Guinea","Macao(China)","Hong Kong(China)","Uganda","Türkiye","Somalia","Seychelles","Rwanda","Nigeria","Libya","Kenya","Ethiopia","Egypt","Djibouti","Azerbaijan","Sudan","South Sudan","Iran","Syria","Sri Lanka","Pakistan","Maldives","Malaysia","Bangladesh","Timor-Leste","Zimbabwe","Zambia","South Africa","Namibia","Mozambique","Mauritius","Malawi","Eswatini","Botswana","Angola","Lesotho","The Central African Republic","Guinea","Togo","Gambia","Sao Tome and Principe","Guinea-Bissau","Reunion","Tunisia","Senegal","Morocco","Mauritania","Madagascar","Israel","Cote d'lvoire","Cameroon","Burkina faso","Benin","Algeria","Burundi","Thailand","Philippines","Nauru","Micronesia","Kiribati","Palau","Marshall Islands","Cook Islands","Vanuatu","Samoa","Indonesia","Cambodia","Taiwan(China)","Nepal","Republic of Korea","Japan","Palestine","Laos","Equatorial Guinea","Mali","Niger","Cape Verde","Tonga","Tuvalu","Bhutan","Solomon Islands","Congo","Ghana","Gabon","Fiji","Congo, Democratic Republic of the","Chad","Brunei","Congo(Kinshasa)","Belarus","Russian Federation","Turkmenistan","Armenia","Malta","The Republic of the Congo"];
  const headerMap = { "country":"Country","Country":"Country","国家":"Country","email":"Email","Email":"Email","邮箱":"Email","邮箱地址":"Email" };

  let lang = "zh", rows = [], originalHeaders = [], canExport = false, lastFilename = "";
  const el = id => document.getElementById(id);
  const T = () => i18n[lang];

  function initCountryAndDate(){
    const csel = el("countrySelect");
    [...new Set(countries)].sort((a,b)=>a.localeCompare(b)).forEach(c=>{
      const o=document.createElement("option"); o.value=c; o.textContent=c; csel.appendChild(o);
    });

    const y = el("attendYear"), m = el("attendMonth"), d = el("attendDay");
    y.innerHTML = '<option value="">YYYY</option>';
    m.innerHTML = '<option value="">MM</option>';
    d.innerHTML = '<option value="">DD</option>';

    for(let yy=2026; yy<=2046; yy++){
      const o=document.createElement("option"); o.value=String(yy); o.textContent=String(yy); y.appendChild(o);
    }
    for(let mm=1; mm<=12; mm++){
      const v=String(mm).padStart(2,"0");
      const o=document.createElement("option"); o.value=v; o.textContent=v; m.appendChild(o);
    }
    for(let dd=1; dd<=31; dd++){
      const v=String(dd).padStart(2,"0");
      const o=document.createElement("option"); o.value=v; o.textContent=v; d.appendChild(o);
    }
  }

  function applyLang(){
    const t = T();
    el("title").textContent = t.title; el("notice").textContent = t.notice;
    el("guideTitle").textContent = t.guideTitle;
    el("guideList").innerHTML = t.guideList.map(x=>`<li>${x}</li>`).join("");
    el("uploadTitle").textContent=t.uploadTitle; el("uploadLabel").textContent=t.uploadLabel; el("uploadHint").textContent=t.uploadHint;
    el("requiredTitle").textContent=t.requiredTitle; el("countryLabel").textContent=t.countryLabel; el("countryHint").textContent=t.countryHint;
    el("customerTypeLabel").textContent=t.customerTypeLabel; el("attendAtLabel").textContent=t.attendAtLabel; el("attendHint").textContent=t.attendHint;
    el("eventInfoTitle").textContent=t.eventInfoTitle; el("eventCategoryLabel").textContent=t.eventCategoryLabel; el("eventNameLabel").textContent=t.eventNameLabel;
    el("actionTitle").textContent=t.actionTitle; el("btnValidate").textContent=t.validateBtn; el("btnExport").textContent=t.exportBtn;
    refreshCustomerHint();
  }

  function refreshCustomerHint(){
    const t=T(), v=el("customerType").value;
    el("customerTypeHint").textContent = v==="Hytera Existing Customer" ? t.customerTypeHint1 : v==="Potential Contact" ? t.customerTypeHint2 : "";
  }

  function splitCSVLine(line){
    const out=[]; let cur="", q=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch === '"'){ if(q && line[i+1] === '"'){ cur+='"'; i++; } else q=!q; }
      else if(ch === "," && !q){ out.push(cur); cur=""; }
      else cur+=ch;
    }
    out.push(cur); return out.map(v=>v.trim());
  }

  function parseCSV(text){
    const lines=text.replace(/\r/g,"").split("\n").filter(Boolean);
    if(!lines.length) return {headers:[], rows:[]};
    const rawHeaders=splitCSVLine(lines[0]);
    const mappedHeaders=rawHeaders.map(h=>headerMap[h]||h);
    const data=[];
    for(let i=1;i<lines.length;i++){
      const cols=splitCSVLine(lines[i]), obj={};
      mappedHeaders.forEach((h,idx)=>obj[h]=cols[idx]??"");
      data.push(obj);
    }
    return {headers:mappedHeaders, rows:data};
  }

  function parseExcel(buffer){
    const wb=XLSX.read(buffer,{type:"array"});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
    if(!aoa.length) return {headers:[],rows:[]};
    const rawHeaders=aoa[0].map(h=>String(h??"").trim());
    const mappedHeaders=rawHeaders.map(h=>headerMap[h]||h);
    const data=[];
    for(let i=1;i<aoa.length;i++){
      const row=aoa[i], obj={};
      mappedHeaders.forEach((h,idx)=>obj[h]=row[idx]??"");
      data.push(obj);
    }
    return {headers:mappedHeaders, rows:data};
  }

  async function readFile(file){
    const name=(file.name||"").toLowerCase();
    if(name.endsWith(".csv")) return parseCSV(await file.text());
    if(name.endsWith(".xlsx") || name.endsWith(".xls")) return parseExcel(await file.arrayBuffer());
    throw new Error("unsupported");
  }

  function getAttendAt(){
    const y=el("attendYear").value, m=el("attendMonth").value, d=el("attendDay").value;
    if(!y || !m || !d) return "";
    return `${y}/${m}/${d}`;
  }

  function setStatus(type,msg){
    const t=T(), b=el("statusBadge");
    b.className = type==="ok" ? "badge ok" : type==="danger" ? "badge danger" : "badge warn";
    b.textContent = type==="ok" ? t.ready : t.blocked;
    el("statusMsg").textContent = msg || "";
  }

  function buildOutputHeaders(){
    // 按你的需求：原有N列 + customer_type + Attend at 紧跟在后面
    const out=[...originalHeaders];
    if(!out.includes("customer_type")) out.push("customer_type");
    if(!out.includes("Attend at")) out.push("Attend at");
    // Country 是必须信息之一，若原始没有则也追加
    if(!out.includes("Country")) out.push("Country");
    // 不要这些
    return out.filter(h=>h!=="lead_source" && h!=="event_name");
  }

  function renderPreview(data){
    const headers=buildOutputHeaders();
    let html="<thead><tr>"+headers.map(h=>`<th>${h}</th>`).join("")+"</tr></thead><tbody>";
    data.slice(0,20).forEach(r=>{ html+="<tr>"+headers.map(h=>`<td>${r[h]??""}</td>`).join("")+"</tr>"; });
    html+="</tbody>"; el("previewTable").innerHTML=html;
  }

  async function validateAll(){
    const t=T(); canExport=false; el("btnExport").disabled=true;
    el("fileNamePreview").textContent=""; el("stats").textContent="";

    const file=el("fileInput").files[0];
    if(!file){ setStatus("danger",t.errFile); return; }

    const lower=(file.name||"").toLowerCase();
    if(!(lower.endsWith(".csv")||lower.endsWith(".xlsx")||lower.endsWith(".xls"))){ setStatus("danger",t.errFormat); return; }

    const customerType=el("customerType").value;
    const attendAt=getAttendAt();
    const selectedCountry=el("countrySelect").value;
    const eventCategory=el("eventCategory").value;
    const eventName=el("eventName").value.trim();

    if(!customerType){ setStatus("danger",t.errCustomerType); return; }
    if(!attendAt){ setStatus("danger",t.errDate); return; }
    if(!eventCategory){ setStatus("danger",t.errCategory); return; }
    if(!eventName){ setStatus("danger",t.errEventName); return; }

    let parsed;
    try{ parsed=await readFile(file); }catch{ setStatus("danger",t.errFormat); return; }

    originalHeaders=parsed.headers; rows=parsed.rows;

    const existingCountries=new Set(rows.map(r=>String(r["Country"]??"").trim()).filter(Boolean));
    const hasMissingCountry=rows.some(r=>!String(r["Country"]??"").trim());

    if(existingCountries.size>1 && hasMissingCountry){ setStatus("danger",t.errCountryMulti); return; }
    if(hasMissingCountry){
      if(!selectedCountry){ setStatus("danger",t.errCountryNeedSelect); return; }
      rows.forEach(r=>{ if(!String(r["Country"]??"").trim()) r["Country"]=selectedCountry; });
    }

    rows.forEach(r=>{ r["customer_type"]=customerType; r["Attend at"]=attendAt; });

    const invalid=rows.filter(r=>!String(r["Country"]??"").trim()||!String(r["customer_type"]??"").trim()||!String(r["Attend at"]??"").trim());
    const total=rows.length, err=invalid.length, ok=total-err;
    if(err>0){ setStatus("danger",t.errRequiredStillMissing); el("stats").textContent=t.stats(total,ok,err); renderPreview(rows); return; }

    const safe=s=>s.replace(/[\\/:*?"<>|]+/g,"-").trim();
    lastFilename=`${safe(eventCategory)}_${safe(eventName)}.csv`;

    setStatus("ok",t.okPass);
    el("fileNamePreview").textContent=t.filePreview+lastFilename;
    el("stats").textContent=t.stats(total,ok,err);
    renderPreview(rows);

    canExport=true; el("btnExport").disabled=false;
  }

  function exportCSV(){
    if(!canExport) return;
    const headers=buildOutputHeaders();
    const esc=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const lines=[headers.join(",")];
    rows.forEach(r=>lines.push(headers.map(h=>esc(r[h])).join(",")));
    const blob=new Blob(["\uFEFF"+lines.join("\n")],{type:"text/csv;charset=utf-8;"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob); a.download=lastFilename||"offline_event_export.csv"; a.click();
    URL.revokeObjectURL(a.href);
  }

  el("btnZh").addEventListener("click",()=>{lang="zh";applyLang();});
  el("btnEn").addEventListener("click",()=>{lang="en";applyLang();});
  el("customerType").addEventListener("change",refreshCustomerHint);
  el("btnValidate").addEventListener("click",validateAll);
  el("btnExport").addEventListener("click",exportCSV);

  initCountryAndDate();
  applyLang();
})();
</script>
</body>
</html>
