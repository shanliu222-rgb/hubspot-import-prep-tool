<!doctype html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HubSpot Offline Event Leads Import Tool</title>
  <meta name="robots" content="noindex,nofollow" />
  <style>
    :root{
      --bg:#f6f8fb; --card:#fff; --text:#1f2937; --muted:#6b7280;
      --primary:#2563eb; --ok:#15803d; --warn:#b45309; --danger:#b91c1c; --border:#e5e7eb;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
    .wrap{max-width:980px;margin:24px auto;padding:0 14px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px}
    h1{margin:0 0 8px;font-size:26px}
    h2{margin:0 0 10px;font-size:18px}
    .muted{color:var(--muted);font-size:13px}
    .row{display:flex;gap:12px;flex-wrap:wrap}
    .col{flex:1;min-width:240px}
    label{display:block;font-weight:600;margin:8px 0 6px}
    input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;background:#fff}
    button{border:0;background:var(--primary);color:#fff;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px}
    .ok{background:#dcfce7;color:#166534}
    .warn{background:#fef3c7;color:#92400e}
    .danger{background:#fee2e2;color:#991b1b}
    table{width:100%;border-collapse:collapse;font-size:12px}
    th,td{border:1px solid var(--border);padding:6px;text-align:left}
    .topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
    .lang button{width:auto;padding:8px 12px;background:#111827}
  </style>
</head>
<body>
<div class="wrap">

  <div class="card">
    <div class="topbar">
      <div>
        <h1 id="title"></h1>
        <div class="muted" id="notice"></div>
      </div>
      <div class="lang">
        <button id="btnZh" type="button">中文</button>
        <button id="btnEn" type="button">EN</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2 id="guideTitle"></h2>
    <ul id="guideList"></ul>
  </div>

  <div class="card">
    <h2 id="uploadTitle"></h2>
    <label id="uploadLabel" for="fileInput"></label>
    <input id="fileInput" type="file" accept=".csv" />
    <div class="muted" id="uploadHint"></div>
  </div>

  <div class="card">
    <h2 id="requiredTitle"></h2>
    <div class="row">
      <div class="col">
        <label id="countryLabel"></label>
        <select id="countrySelect">
          <option value="">--</option>
        </select>
        <div class="muted" id="countryHint"></div>
      </div>

      <div class="col">
        <label id="customerTypeLabel"></label>
        <select id="customerType">
          <option value="">--</option>
          <option value="Hytera Existing Customer">Hytera Existing Customer</option>
          <option value="Potential Contact">Potential Contact</option>
        </select>
        <div class="muted" id="customerTypeHint"></div>
      </div>

      <div class="col">
        <label id="attendAtLabel"></label>
        <input id="attendAt" type="text" placeholder="YYYY/MM/DD" />
      </div>
    </div>
  </div>

  <div class="card">
    <h2 id="eventInfoTitle"></h2>
    <div class="row">
      <div class="col">
        <label id="eventCategoryLabel"></label>
        <select id="eventCategory">
          <option value="">--</option>
          <option>Exhibition</option>
          <option>Offline Activity</option>
          <option>Sales Contact</option>
          <option>Dealer Distributor</option>
          <option>Promotion</option>
          <option>Third Party Database</option>
          <option>Staff</option>
          <option>Online Webinar</option>
        </select>
      </div>
      <div class="col">
        <label id="eventNameLabel"></label>
        <input id="eventName" type="text" placeholder="e.g. AI Security Roadshow Dubai" />
      </div>
    </div>
  </div>

  <div class="card">
    <h2 id="actionTitle"></h2>
    <button id="btnValidate" type="button"></button>
    <p style="margin-top:10px;"><span id="statusBadge" class="badge warn"></span></p>
    <div id="statusMsg" class="muted"></div>
    <p id="fileNamePreview" class="muted" style="margin-top:8px;"></p>
    <p id="stats" class="muted"></p>
    <button id="btnExport" type="button" disabled></button>

    <div style="margin-top:12px;max-height:260px;overflow:auto">
      <table id="previewTable"></table>
    </div>
  </div>

</div>

<script>
(() => {
  const i18n = {
    zh: {
      title: "HubSpot 线下活动线索导入工具",
      notice: "内部使用声明 / Internal Use Notice：仅用于市场部HubSpot导入前整理；文件仅在浏览器本地处理，不上传、不保存。",
      guideTitle: "使用指导（仅线下活动）",
      guideList: [
        "必须信息：国家（Country）、客户类型（Customer Type）、Attend at。",
        "国家规则：若文件涉及多个国家且存在国家缺失，系统将阻断导出，请线下逐条补齐后重传。",
        "Attend at 格式必须为 YYYY/MM/DD。",
        "导出文件：保留原始上传字段 + 在末尾追加必要信息字段。"
      ],
      uploadTitle: "1) 上传数据文件",
      uploadLabel: "上传 CSV 文件",
      uploadHint: "仅支持 CSV；首行为字段名。",

      requiredTitle: "2) 补充必填信息",
      countryLabel: "国家（仅用于单一国家统一补齐）",
      countryHint: "如果你确认本批数据是单一国家，可在此选择并自动填充缺失国家。",
      customerTypeLabel: "客户类型（必选）",
      customerTypeHint1: "提示：Dealer or Distributor or Partner（仅提示）",
      customerTypeHint2: "提示：not Dealer or Distributor or Partner（仅提示）",
      attendAtLabel: "Attend at（必填，YYYY/MM/DD）",

      eventInfoTitle: "3) 活动信息（用于文件命名）",
      eventCategoryLabel: "活动类型（必选）",
      eventNameLabel: "活动名称（必填）",

      actionTitle: "4) 校验并导出",
      validateBtn: "开始校验",
      exportBtn: "导出 CSV",
      blocked: "未通过",
      ready: "可导出",

      errFile: "请先上传 CSV 文件。",
      errCustomerType: "请选择客户类型。",
      errDate: "Attend at 格式必须是 YYYY/MM/DD。",
      errCategory: "请选择活动类型。",
      errEventName: "请填写活动名称。",
      errCountryNeedSelect: "存在国家缺失，请先从下拉中选择一个国家，再次校验。",
      errCountryMulti: "检测到可能涉及多个国家且存在缺失。请线下逐条补齐国家信息后重新上传。",
      errRequiredStillMissing: "仍有必填项缺失，无法导出。",

      okPass: "校验通过，可导出。",
      stats: (t,v,e) => `总行数: ${t} ｜ 可上传: ${v} ｜ 错误: ${e}`,
      filePreview: "导出文件名预览："
    },
    en: {
      title: "HubSpot Offline Event Leads Import Tool",
      notice: "Internal Use Notice: For marketing prep before HubSpot import only. Files are processed locally in the browser and are not uploaded or stored.",
      guideTitle: "Guide (Offline Event only)",
      guideList: [
        "Required info: Country, Customer Type, Attend at.",
        "Country rule: if multiple countries are involved AND country is missing in some rows, export is blocked.",
        "Attend at format must be YYYY/MM/DD.",
        "Output file keeps original uploaded columns + appends required fields at the end."
      ],
      uploadTitle: "1) Upload data file",
      uploadLabel: "Upload CSV file",
      uploadHint: "CSV only; first row should be headers.",

      requiredTitle: "2) Fill required information",
      countryLabel: "Country (for global fill only when single-country batch)",
      countryHint: "If this batch is single-country, select one country to fill missing values.",
      customerTypeLabel: "Customer Type (required)",
      customerTypeHint1: "Hint: Dealer or Distributor or Partner (hint only)",
      customerTypeHint2: "Hint: not Dealer or Distributor or Partner (hint only)",
      attendAtLabel: "Attend at (required, YYYY/MM/DD)",

      eventInfoTitle: "3) Event info (for file naming)",
      eventCategoryLabel: "Event Type (required)",
      eventNameLabel: "Event Name (required)",

      actionTitle: "4) Validate and export",
      validateBtn: "Validate",
      exportBtn: "Export CSV",
      blocked: "Blocked",
      ready: "Ready",

      errFile: "Please upload a CSV file first.",
      errCustomerType: "Please select Customer Type.",
      errDate: "Attend at format must be YYYY/MM/DD.",
      errCategory: "Please select Event Type.",
      errEventName: "Please input Event Name.",
      errCountryNeedSelect: "Country is missing. Select one country from dropdown and validate again.",
      errCountryMulti: "Possible multi-country batch with missing country values. Please fill country row-by-row offline and re-upload.",
      errRequiredStillMissing: "Required fields are still missing. Export is blocked.",

      okPass: "Validation passed. Ready to export.",
      stats: (t,v,e) => `Total: ${t} | Valid: ${v} | Error: ${e}`,
      filePreview: "Output filename preview: "
    }
  };

  const countries = ["Uzbekistan","Ukraine","Tajikistan","Mongolia","Kyrgyzstan","Kazakhstan","Afghanistan","Georgia","Yemen","United Arab Emirates","Sierra Leone","Saudi Arabia","Qatar","Oman","Liberia","Kuwait","Iraq","Eritrea","Bahrain","Tanzania","Lebanon","Jordan","Vietnam","Singapore","Myanmar","New Zealand","India","Australia","Papua New Guinea","Macao(China)","Hong Kong(China)","Uganda","Türkiye","Somalia","Seychelles","Rwanda","Nigeria","Libya","Kenya","Ethiopia","Egypt","Djibouti","Azerbaijan","Sudan","South Sudan","Iran","Syria","Sri Lanka","Pakistan","Maldives","Malaysia","Bangladesh","Timor-Leste","Zimbabwe","Zambia","South Africa","Namibia","Mozambique","Mauritius","Malawi","Eswatini","Botswana","Angola","Lesotho","The Central African Republic","Guinea","Togo","Gambia","Sao Tome and Principe","Guinea-Bissau","Reunion","Tunisia","Senegal","Morocco","Mauritania","Madagascar","Israel","Cote d'lvoire","Cameroon","Burkina faso","Benin","Algeria","Burundi","Thailand","Philippines","Nauru","Micronesia","Kiribati","Palau","Marshall Islands","Cook Islands","Vanuatu","Samoa","Indonesia","Cambodia","Taiwan(China)","Nepal","Republic of Korea","Japan","Palestine","Laos","Equatorial Guinea","Mali","Niger","Cape Verde","Tonga","Tuvalu","Bhutan","Solomon Islands","Congo","Ghana","Gabon","Fiji","Congo, Democratic Republic of the","Chad","Brunei","Congo(Kinshasa)","Belarus","Russian Federation","Turkmenistan","Armenia","Malta","The Republic of the Congo"];

  const headerMap = {
    "country":"Country","Country":"Country","国家":"Country",
    "email":"Email","Email":"Email","邮箱":"Email","邮箱地址":"Email"
  };

  let lang = "zh";
  let rows = [];
  let originalHeaders = [];
  let canExport = false;
  let lastFilename = "";

  const el = id => document.getElementById(id);
  const T = () => i18n[lang];

  function initCountry(){
    const unique = [...new Set(countries)].sort((a,b)=>a.localeCompare(b));
    const sel = el("countrySelect");
    sel.innerHTML = '<option value="">--</option>';
    unique.forEach(c=>{
      const op = document.createElement("option");
      op.value = c; op.textContent = c;
      sel.appendChild(op);
    });
  }

  function applyLang(){
    const t = T();
    el("title").textContent = t.title;
    el("notice").textContent = t.notice;
    el("guideTitle").textContent = t.guideTitle;
    el("guideList").innerHTML = t.guideList.map(x=>`<li>${x}</li>`).join("");

    el("uploadTitle").textContent = t.uploadTitle;
    el("uploadLabel").textContent = t.uploadLabel;
    el("uploadHint").textContent = t.uploadHint;

    el("requiredTitle").textContent = t.requiredTitle;
    el("countryLabel").textContent = t.countryLabel;
    el("countryHint").textContent = t.countryHint;
    el("customerTypeLabel").textContent = t.customerTypeLabel;
    el("attendAtLabel").textContent = t.attendAtLabel;

    el("eventInfoTitle").textContent = t.eventInfoTitle;
    el("eventCategoryLabel").textContent = t.eventCategoryLabel;
    el("eventNameLabel").textContent = t.eventNameLabel;

    el("actionTitle").textContent = t.actionTitle;
    el("btnValidate").textContent = t.validateBtn;
    el("btnExport").textContent = t.exportBtn;
    refreshCustomerHint();
  }

  function refreshCustomerHint(){
    const t = T();
    const v = el("customerType").value;
    if(v==="Hytera Existing Customer") el("customerTypeHint").textContent = t.customerTypeHint1;
    else if(v==="Potential Contact") el("customerTypeHint").textContent = t.customerTypeHint2;
    else el("customerTypeHint").textContent = "";
  }

  function splitCSVLine(line){
    const out=[]; let cur=""; let q=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch === '"'){
        if(q && line[i+1] === '"'){ cur += '"'; i++; }
        else q = !q;
      } else if(ch === "," && !q){ out.push(cur); cur=""; }
      else cur += ch;
    }
    out.push(cur);
    return out.map(v=>v.trim());
  }

  function parseCSV(text){
    const lines = text.replace(/\r/g,"").split("\n").filter(Boolean);
    if(!lines.length) return {headers:[],rows:[]};
    const headers = splitCSVLine(lines[0]);
    const mappedHeaders = headers.map(h => headerMap[h] || h);

    const data = [];
    for(let i=1;i<lines.length;i++){
      const cols = splitCSVLine(lines[i]);
      const obj = {};
      mappedHeaders.forEach((h,idx)=> obj[h] = cols[idx] ?? "");
      data.push(obj);
    }
    return {headers:mappedHeaders, rows:data};
  }

  function validDate(v){ return /^\d{4}\/\d{2}\/\d{2}$/.test(v); }

  function setStatus(type,msg){
    const t = T();
    const b = el("statusBadge");
    if(type==="ok"){ b.className="badge ok"; b.textContent=t.ready; }
    else if(type==="danger"){ b.className="badge danger"; b.textContent=t.blocked; }
    else { b.className="badge warn"; b.textContent=t.blocked; }
    el("statusMsg").textContent = msg || "";
  }

  function buildOutputHeaders(){
    // 保留原始字段 + 追加必要字段（若原本没有）
    const requiredTail = ["Country","customer_type","Attend at"];
    const out = [...originalHeaders];
    requiredTail.forEach(h=>{
      if(!out.includes(h)) out.push(h);
    });
    return out;
  }

  function renderPreview(data){
    const outHeaders = buildOutputHeaders();
    let html = "<thead><tr>" + outHeaders.map(h=>`<th>${h}</th>`).join("") + "</tr></thead><tbody>";
    data.slice(0,20).forEach(r=>{
      html += "<tr>" + outHeaders.map(h=>`<td>${r[h] ?? ""}</td>`).join("") + "</tr>";
    });
    html += "</tbody>";
    el("previewTable").innerHTML = html;
  }

  function validateAll(){
    const t = T();
    canExport = false;
    el("btnExport").disabled = true;
    el("fileNamePreview").textContent = "";
    el("stats").textContent = "";

    const file = el("fileInput").files[0];
    if(!file){ setStatus("danger", t.errFile); return; }

    const customerType = el("customerType").value;
    const attendAt = el("attendAt").value.trim();
    const selectedCountry = el("countrySelect").value;
    const eventCategory = el("eventCategory").value;
    const eventName = el("eventName").value.trim();

    if(!customerType){ setStatus("danger", t.errCustomerType); return; }
    if(!validDate(attendAt)){ setStatus("danger", t.errDate); return; }
    if(!eventCategory){ setStatus("danger", t.errCategory); return; }
    if(!eventName){ setStatus("danger", t.errEventName); return; }

    const fr = new FileReader();
    fr.onload = () => {
      const parsed = parseCSV(fr.result);
      originalHeaders = parsed.headers;
      rows = parsed.rows;

      const existingCountries = new Set(rows.map(r => (r["Country"]||"").trim()).filter(Boolean));
      const hasMissingCountry = rows.some(r => !(r["Country"]||"").trim());

      if(existingCountries.size > 1 && hasMissingCountry){
        setStatus("danger", t.errCountryMulti);
        return;
      }

      if(hasMissingCountry){
        if(!selectedCountry){ setStatus("danger", t.errCountryNeedSelect); return; }
        rows.forEach(r => { if(!(r["Country"]||"").trim()) r["Country"] = selectedCountry; });
      }

      rows.forEach(r => {
        r["customer_type"] = customerType;
        r["Attend at"] = attendAt;
      });

      const invalid = rows.filter(r => !(r["Country"]||"").trim() || !(r["customer_type"]||"").trim() || !(r["Attend at"]||"").trim());
      const total = rows.length, err = invalid.length, ok = total - err;
      if(err > 0){
        setStatus("danger", t.errRequiredStillMissing);
        el("stats").textContent = t.stats(total,ok,err);
        renderPreview(rows);
        return;
      }

      // 文件名：活动类型+活动名称
      const safe = s => s.replace(/[\\/:*?"<>|]+/g,"-").trim();
      lastFilename = `${safe(eventCategory)}_${safe(eventName)}.csv`;

      setStatus("ok", t.okPass);
      el("fileNamePreview").textContent = t.filePreview + lastFilename;
      el("stats").textContent = t.stats(total,ok,err);
      renderPreview(rows);

      canExport = true;
      el("btnExport").disabled = false;
    };
    fr.readAsText(file, "utf-8");
  }

  function exportCSV(){
    if(!canExport) return;
    const outHeaders = buildOutputHeaders();
    const esc = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
    const lines = [outHeaders.join(",")];
    rows.forEach(r=>{
      lines.push(outHeaders.map(h => esc(r[h])).join(","));
    });

    const blob = new Blob([lines.join("\n")], {type:"text/csv;charset=utf-8;"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = lastFilename || "offline_event_export.csv";
    a.click();
    URL.revokeObjectURL(a.href);
  }

  el("btnZh").addEventListener("click", ()=>{ lang="zh"; applyLang(); });
  el("btnEn").addEventListener("click", ()=>{ lang="en"; applyLang(); });
  el("customerType").addEventListener("change", refreshCustomerHint);
  el("btnValidate").addEventListener("click", validateAll);
  el("btnExport").addEventListener("click", exportCSV);

  initCountry();
  applyLang();
})();
</script>
</body>
</html>
